<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 6 Golden Hexagons arranged in ring -->
  <g transform="translate(50,50)" filter="url(#glow)">
    <!-- Top -->
    <path transform="translate(0, -22) rotate(0)" d="M 0 -9.5 L 8.2 -4.75 L 8.2 4.75 L 0 9.5 L -8.2 4.75 L -8.2 -4.75 Z" fill="url(#goldHighlight)" stroke="#FDE68A" stroke-width="0.8" stroke-linejoin="round" rx="2.5" />
    
    <!-- Top Right -->
    <path transform="translate(19.05, -11) rotate(60)" d="M 0 -9.5 L 8.2 -4.75 L 8.2 4.75 L 0 9.5 L -8.2 4.75 L -8.2 -4.75 Z" fill="url(#gold)" stroke="#FDE68A" stroke-width="0.8" stroke-linejoin="round" />
    
    <!-- Bottom Right -->
    <path transform="translate(19.05, 11) rotate(120)" d="M 0 -9.5 L 8.2 -4.75 L 8.2 4.75 L 0 9.5 L -8.2 4.75 L -8.2 -4.75 Z" fill="url(#gold)" stroke="#FDE68A" stroke-width="0.8" stroke-linejoin="round" />
    
    <!-- Bottom -->
    <path transform="translate(0, 22) rotate(180)" d="M 0 -9.5 L 8.2 -4.75 L 8.2 4.75 L 0 9.5 L -8.2 4.75 L -8.2 -4.75 Z" fill="url(#goldHighlight)" stroke="#FDE68A" stroke-width="0.8" stroke-linejoin="round" />
    
    <!-- Bottom Left -->
    <path transform="translate(-19.05, 11) rotate(240)" d="M 0 -9.5 L 8.2 -4.75 L 8.2 4.75 L 0 9.5 L -8.2 4.75 L -8.2 -4.75 Z" fill="url(#gold)" stroke="#FDE68A" stroke-width="0.8" stroke-linejoin="round" />
    
    <!-- Top Left -->
    <path transform="translate(-19.05, -11) rotate(300)" d="M 0 -9.5 L 8.2 -4.75 L 8.2 4.75 L 0 9.5 L -8.2 4.75 L -8.2 -4.75 Z" fill="url(#gold)" stroke="#FDE68A" stroke-width="0.8" stroke-linejoin="round" />
  </g>
</svg>